<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VoiceForge AI - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Geist:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .glass-panel {
            background-color: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            background-image: linear-gradient(to bottom, rgba(255,255,255,0.03), transparent);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#c0c1ff",
                        "on-tertiary-fixed": "#311400",
                        "surface-container-highest": "#2d3449",
                        "surface-variant": "#2d3449",
                        "surface-bright": "#31394d",
                        "primary-fixed": "#d8e2ff",
                        "on-background": "#dae2fd",
                        "tertiary": "#ffb786",
                        "surface-container-low": "#131b2e",
                        "outline-variant": "#424754",
                        "surface-dim": "#0b1326",
                        "on-surface-variant": "#c2c6d6",
                        "on-primary-container": "#00285d",
                        "surface-container-lowest": "#060e20",
                        "secondary-fixed": "#e1e0ff",
                        "background": "#0b1326",
                        "on-secondary-fixed": "#07006c",
                        "on-secondary": "#1000a9",
                        "inverse-surface": "#dae2fd",
                        "on-tertiary-container": "#461f00",
                        "on-tertiary": "#502400",
                        "on-primary-fixed": "#001a42",
                        "secondary-container": "#3131c0",
                        "outline": "#8c909f",
                        "error-container": "#93000a",
                        "on-primary-fixed-variant": "#004395",
                        "on-tertiary-fixed-variant": "#723600",
                        "tertiary-fixed": "#ffdcc6",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb786",
                        "on-primary": "#002e6a",
                        "surface-container": "#171f33",
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-error": "#690005",
                        "surface-tint": "#adc6ff",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "inverse-primary": "#005ac2",
                        "tertiary-container": "#df7412",
                        "surface-container-high": "#222a3d",
                        "primary-container": "#4d8eff",
                        "surface": "#0b1326",
                        "primary": "#adc6ff",
                        "primary-fixed-dim": "#adc6ff",
                        "error": "#ffb4ab",
                        "on-secondary-container": "#b0b2ff",
                        "on-surface": "#dae2fd",
                        "inverse-on-surface": "#283044"
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        lg: "2rem",
                        xl: "3rem",
                        full: "9999px"
                    },
                    spacing: {
                        unit: "4px",
                        xs: "8px",
                        "margin-mobile": "16px",
                        md: "24px",
                        lg: "48px",
                        gutter: "24px",
                        sm: "16px",
                        "container-max": "1280px",
                        xl: "80px"
                    },
                    fontFamily: {
                        "label-sm": ["Geist"],
                        "label-md": ["Geist"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-xl": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    fontSize: {
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "500" }],
                        "body-lg": ["18px", { lineHeight: "28px", letterSpacing: "0em", fontWeight: "400" }],

                        "headline-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
                        "display-xl": ["64px", { lineHeight: "72px", letterSpacing: "-0.04em", fontWeight: "700" }],
                        "headline-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }]
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Ambient Background glow -->
<div class="absolute inset-0 z-0 pointer-events-none flex justify-center items-center opacity-30">
<div class="w-[800px] h-[800px] bg-primary rounded-full blur-[120px] mix-blend-screen opacity-20 translate-y-[-20%]"></div>
<div class="w-[600px] h-[600px] bg-secondary-container rounded-full blur-[100px] mix-blend-screen opacity-20 translate-y-[20%] translate-x-[-20%]"></div>
</div>
<!-- Main Content -->
<main class="relative z-10 w-full max-w-md px-margin-mobile sm:px-0">
<!-- Header / Logo Area -->
<div class="flex justify-center mb-md">
<div class="flex items-center gap-xs text-primary">
<span class="material-symbols-outlined text-headline-md" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
<span class="font-headline-md text-on-surface tracking-tight">VoiceForge</span>
</div>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-lg p-md sm:p-lg w-full flex flex-col gap-md">
<div class="text-center flex flex-col gap-xs">
<h1 class="font-headline-md text-on-surface">Welcome back</h1>
<p class="font-body-md text-on-surface-variant">Sign in to continue your audio synthesis.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-sm">
<!-- Email Input -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-DEFAULT py-sm pl-xl pr-sm text-on-surface font-body-md placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-DEFAULT py-sm pl-xl pr-sm text-on-surface font-body-md placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-xs w-full bg-primary text-on-primary-fixed font-headline-md text-base rounded-full py-sm px-md hover:bg-primary-fixed transition-colors flex items-center justify-center gap-xs" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-sm opacity-60">
<div class="flex-1 h-[1px] bg-outline-variant"></div>
<span class="font-label-sm text-on-surface-variant">OR CONTINUE WITH</span>
<div class="flex-1 h-[1px] bg-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-sm">
<button class="flex-1 bg-surface-container-low border border-outline-variant rounded-DEFAULT py-sm flex justify-center items-center hover:bg-surface-container transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors">code</span>
</button>
<button class="flex-1 bg-surface-container-low border border-outline-variant rounded-DEFAULT py-sm flex justify-center items-center hover:bg-surface-container transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors">account_circle</span>
</button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-md text-center">
<p class="font-body-md text-on-surface-variant">
                Don't have an account? <a class="text-primary hover:text-primary-fixed font-medium transition-colors" href="#">Sign up</a>
</p>
</div>
</main>
</body></html>
