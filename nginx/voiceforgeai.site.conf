# Nginx configuration for VoiceForge AI (Traditional host-based / non-pure-Docker setup)
#
# WARNING: This config is for classic deployments (PM2 + static files on the host filesystem).
# For modern reliable Docker + VPS hosting, use the Caddy service included in docker-compose.yml
# (see DOCKER_VPS_DEPLOYMENT.md). It is simpler, has auto HTTPS, and avoids all the path problems below.
#
# If you must use host nginx + certbot with the Docker stack:
#   - The compose already publishes 127.0.0.1:3000 and :5000 safely.
#   - For /uploads, either (a) proxy /uploads/ to http://127.0.0.1:5000/uploads/ or
#     (b) bind-mount the "uploads_data" Docker volume to a host path and point the alias at it.
#
# Place this file in /etc/nginx/sites-available/voiceforgeai.site
# Then symlink: ln -s /etc/nginx/sites-available/voiceforgeai.site /etc/nginx/sites-enabled/
#
# Required environment on server:
#   - SSL certificate at /etc/letsencrypt/live/voiceforgeai.site/
#   - Backend running on localhost:5000 (PM2 or docker)
#   - Frontend on localhost:3000 or static export

server {
    listen 80;
    server_name voiceforgeai.site www.voiceforgeai.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name voiceforgeai.site www.voiceforgeai.site;

    ssl_certificate /etc/letsencrypt/live/voiceforgeai.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voiceforgeai.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client body size for uploads
    client_max_body_size 50M;

    # Ensure correct MIME types for audio files
    types {
        audio/mpeg  mp3;
        audio/wav   wav;
        audio/ogg   ogg;
        audio/webm  webm;
        audio/mp4   m4a;
    }

    # Static uploads — serve directly from filesystem (bypass Node.js)
    location /uploads/ {
        alias /var/www/voiceforgeai.site/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "https://voiceforgeai.site" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Accept-Ranges bytes;
    }

    # API proxy — backend Node.js/Express
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;

        # CORS headers for API (backup in case Express CORS fails)
        add_header Access-Control-Allow-Origin "https://voiceforgeai.site" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Next.js frontend (static export or running on port 3000)
    # Option A: If using Next.js export (static HTML):
    # location / {
    #     root /var/www/voiceforgeai.site/frontend/out;
    #     try_files $uri $uri.html $uri/index.html =404;
    # }
    #
    # Option B: If using Next.js dev server or running app on port 3000:
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
