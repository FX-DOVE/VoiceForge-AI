version: '3.8'

services:
  # Redis (required for BullMQ job queues)
  redis:
    image: redis:7-alpine
    container_name: voiceforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceforge-network

  # Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceforge-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voiceforge-network
    # Optional: Increase if you process very large files
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 1G

  # Background Worker (BullMQ - handles long TTS + Voice Cloning)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceforge-worker
    restart: unless-stopped
    command: node src/jobs/worker.js
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - voiceforge-network
    # Workers can be more resource intensive for TTS generation
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G

  # Frontend (Next.js) - Uncomment when ready
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: voiceforge-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - ./frontend/.env.local
  #   depends_on:
  #     - api
  #   networks:
  #     - voiceforge-network

volumes:
  redis_data:
    driver: local

networks:
  voiceforge-network:
    driver: bridge
