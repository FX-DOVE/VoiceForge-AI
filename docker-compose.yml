# VoiceForge AI — Production Docker Compose for VPS
# ============================================================
# This setup is optimized for reliable, zero-hassle deployment on a VPS using only Docker.
#
# Recommended hosting stack:
#   - Docker + Docker Compose
#   - Caddy (included below) for automatic HTTPS + reverse proxy (easiest, no certbot pain)
#   - External MongoDB (MongoDB Atlas free tier or self-hosted on same VPS)
#
# Quick start (see DOCKER_VPS_DEPLOYMENT.md for full guide):
#   1. cp backend/.env.example backend/.env
#   2. Edit backend/.env (set strong secrets, MONGODB_URI, XAI key, etc.)
#   3. (Optional but recommended) Create a .env file in this directory with:
#        DOMAIN=yourdomain.com
#   4. Edit Caddyfile and replace voiceforgeai.site with your real domain
#   5. docker compose down
#   6. docker compose up -d --build
#   7. Point your domain DNS to the VPS IP. Caddy will auto-provision SSL.
#
# Key production features:
#   - Persistent uploads volume (generated audio never lost on rebuilds/restarts)
#   - Non-root containers + volume permission fixes (common VPS gotcha solved)
#   - Working healthchecks for all services
#   - Build-time + runtime env support for custom domains
#   - Caddy for automatic HTTPS + reverse proxy using internal Docker DNS names
#   - Correct networking: 'expose' instead of localhost-only ports (fixes "Connection refused" from Caddy)
#
# For updates: docker compose pull && docker compose up -d --build

services:
  # Redis (required for BullMQ job queues for TTS + voice cloning)
  redis:
    image: redis:7-alpine
    container_name: voiceforge-redis
    restart: unless-stopped
    # Redis is internal only. No host exposure needed when using the included Caddy.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceforge-network

  # Backend API Server (Express)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceforge-api
    restart: unless-stopped
    # Internal-only access via Docker network (Caddy reaches it via http://api:5000).
    # We use 'expose' instead of 'ports' so nothing is published on the host.
    # Only Caddy will reach these services.
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      # These are critical for Docker VPS with custom domain.
      # Set CLIENT_URL and SERVER_URL in backend/.env to your public https://domain.com
      # (or use root .env + interpolation if you extend this file)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # wget is now installed in the backend image (see Dockerfile)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # CRITICAL: Persistent storage for all generated audio, voice clones, uploads.
      # Without this, every docker compose down / rebuild wipes user data.
      - uploads_data:/app/uploads
    networks:
      - voiceforge-network

  # Background Worker (BullMQ - handles long-running TTS generation + voice cloning jobs)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceforge-worker
    restart: unless-stopped
    command: npm run worker
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Same persistent uploads for worker (it writes generated files too)
      - uploads_data:/app/uploads
    networks:
      - voiceforge-network

  # Frontend (Next.js 15 standalone - production optimized)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Pass build-time public variables so metadata, canonical URLs, sitemaps,
      # OpenGraph, and middleware domain enforcement work correctly with YOUR domain.
      # These must be known at `next build` time.
      #
      # Recommended: Create a .env file next to this docker-compose.yml containing:
      #   DOMAIN=yourdomain.com
      # Then Docker Compose will interpolate ${DOMAIN}.
      args:
        NEXT_PUBLIC_SITE_URL: "https://${DOMAIN:-localhost:3000}"
        # NEXT_PUBLIC_API_URL is usually "/api" (Next rewrites handle it). Only override if needed.
        # NEXT_PUBLIC_API_URL: "/api"
    container_name: voiceforge-frontend
    restart: unless-stopped
    # Internal-only access. Caddy reaches the frontend via the Docker network (http://frontend:3000).
    # We deliberately avoid publishing ports on the host so only Caddy can talk to it.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Internal Docker DNS name for backend (used by Next.js rewrites in next.config.mjs)
      - BACKEND_URL=http://api:5000
      # Also pass runtime (non-public) if your frontend ever reads other vars
      # SITE_URL will be picked from NEXT_PUBLIC_SITE_URL baked at build above.
    depends_on:
      - api
    networks:
      - voiceforge-network
    healthcheck:
      # Next.js standalone serves on the port defined by PORT / HOSTNAME envs
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Caddy - Automatic HTTPS reverse proxy (included and enabled by default)
  # - Automatic Let's Encrypt certificates
  # - Proxies /api/* and /uploads/* to the backend
  # - Everything else goes to the Next.js frontend
  # - Uses internal Docker service names (frontend, api) — this is critical
  #
  # Edit the Caddyfile and put your real domain before deploying.
  caddy:
    image: caddy:2-alpine
    container_name: voiceforge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api
    networks:
      - voiceforge-network
    healthcheck:
      # Lightweight healthcheck for Caddy (admin is disabled in Caddyfile)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Named volumes = data survives container recreation / image updates / server reboots
volumes:
  redis_data:
    driver: local
  uploads_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  voiceforge-network:
    driver: bridge

