version: '3.8'

services:
  # Redis (required for BullMQ job queues)
  redis:
    image: redis:7-alpine
    container_name: voiceforge-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # Only localhost (for your Nginx if needed)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceforge-network

  # Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceforge-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # Only localhost (Nginx will proxy to this)
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - voiceforge-network

  # Background Worker (BullMQ - handles long TTS + Voice Cloning)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceforge-worker
    restart: unless-stopped
    command: npm run worker
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - voiceforge-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voiceforge-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # Only localhost (your Nginx proxies to this)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://api:5000
    depends_on:
      - api
    networks:
      - voiceforge-network

volumes:
  redis_data:
    driver: local

networks:
  voiceforge-network:
    driver: bridge
